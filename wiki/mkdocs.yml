# MkDocs 站点配置
# 参考文档: https://squidfunk.github.io/mkdocs-material/

site_name: CCNavigationTable Wiki
site_description: CC Navigation Table (导航电脑) Mod 的文档站点
site_url: https://ZombieEggStew.github.io/ccnavigationtable-template-1.21.1/

theme:
  name: material        # Material 主题
  language: zh          # 界面语言: 中文
  palette:
