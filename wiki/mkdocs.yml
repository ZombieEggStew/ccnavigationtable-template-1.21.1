# MkDocs 站点配置
# 参考文档: https://squidfunk.github.io/mkdocs-material/
# 多语言: https://ultrabug.github.io/mkdocs-static-i18n/
# 默认语言为英文 (en)，中文 (zh) 为第二语言

site_name: CCPE Wiki
site_description: CCPE Wiki - Documentation for the CC Peripheral Extender mod
site_url: https://ZombieEggStew.github.io/ccnavigationtable-template-1.21.1/

theme:
  name: material
  language: en
  palette:
    scheme: slate
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          name: 中文
          build: true
          site_description: CC Peripheral Extender (CC 外设扩展器) Mod 文档站点
          nav_translations:
            Home: 首页
            Overview: 概述
            Peripheral Extender: 外设扩展器
            Redstone Transceiver: 红石收发器
            Electronic Transmission: 电子变速箱
            Aero Bearing: 航空轴承
            Servo Mode: 舵机模式
            Modular Monitor: 模块化监视器
            Monitor: 监视器
            Button Module: 按钮模块
            Switch Module: 开关模块
            Knob Module: 旋钮模块
            Screen Module: 屏幕模块
            Control Desk: 控制台
            Foot Pedal: 脚踏板
            Joystick: 操纵杆
            Joystick 2: 操纵杆 2
            Throttle: 油门
            Throttle 2: 油门 2
            Monitor 2: 监视器 2
            Dock: 拓展坞
            Baffle: 挡板
            Examples & Tutorials: 示例与教程
            Simple Monitoring System: 简单监控系统
            Channel Setup: 频道设置
            Block NBT Reading: 方块 NBT 读取
            Peripheral Proxy: 外设代理
            Wireless Redstone: 无线红石
            Aeronautics Sensor Integration: 航空学传感器集成
            Chunk & Physics Body Loading: 区块/物理结构加载
            Lua API Reference: Lua API 参考
            FAQ: 常见问题
            Changelog: 更新日志
        - locale: en
          name: English
          default: true
          build: true

# 导航结构 (nav 使用默认语言 = English)
