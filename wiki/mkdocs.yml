# MkDocs 站点配置
# 参考文档: https://squidfunk.github.io/mkdocs-material/

site_name: CCPE Wiki
site_description: CC Peripheral Extender (CC 外设扩展器) Mod 文档站点
site_url: https://ZombieEggStew.github.io/ccnavigationtable-template-1.21.1/

theme:
  name: material
  language: zh
  palette:
    scheme: slate
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables

# 导航结构
nav:
  - 首页: index.md
  - 外设扩展器:
    - 概述: peripheral-extender/overview.md
    - 频道设置: peripheral-extender/channel-setup.md
    - 方块 NBT 读取: peripheral-extender/nbt-reading.md
    - 外设代理: peripheral-extender/peripheral-proxy.md
    - 无线红石: peripheral-extender/wireless-redstone.md
    - 航空学传感器集成: peripheral-extender/simulated-integration.md
    - 区块/物理结构加载: peripheral-extender/chunk-loading.md
    - Lua API 参考: api-reference.md
    - 简单监控系统: peripheral-extender/example.md
  - 红石收发器:
    - 概述: redstone-transceiver/overview.md
  - 电子变速箱:
    - 概述: electronic-transmission/overview.md
  - 模块化监视器:
    - 概述: monitor/overview.md
    - 监视器 : monitor/monitor.md
    - 按钮模块 : monitor/button.md
    - 开关模块 : monitor/switch.md
    - 旋钮模块 : monitor/knob.md
    - 屏幕模块 : monitor/screen.md
  - 示例与教程:
    - 简单监控系统: peripheral-extender/example.md
  - 常见问题: faq.md
  - 更新日志: changelog.md
