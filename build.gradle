plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // 本地手动下载的依赖，优先�?libs/ 解析
    maven {
        name = 'LocalLibs'
        url = file('libs')
    }
    mavenLocal() // 也可�?%USERPROFILE%\.m2\repository
    maven {
        name = 'Create Maven'
        url = 'https://maven.createmod.net'
        content {
            includeGroup 'com.simibubi.create'
            includeGroup 'net.createmod.ponder'
            includeGroup 'net.createmod.catnip'
            includeGroup 'net.createmod'
            includeGroup 'dev.engine-room.flywheel'
        }
    }
    maven {
        name = 'tterrag Maven (Registrate)'
        url = 'https://maven.ithundxr.dev/snapshots'
        content {
            includeGroup 'com.tterrag.registrate'
        }
    }
    maven {
        name = 'CC:Tweaked Maven'
        url = 'https://maven.squiddev.cc'
        content {
            includeGroup 'cc.tweaked'
        }
    }
    maven {
        name = 'RyanHCode Maven (Sable)'
        url = 'https://maven.ryanhcode.dev/releases'
        content {
            includeGroup 'dev.ryanhcode.sable'
            includeGroup 'dev.ryanhcode.sable-companion'
        }
    }
    maven {
        name = 'JEI Maven'
        url = 'https://maven.blamejared.com/'
    }
}


base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // ---- Create -----------------------------------------------------------
    // Slim jar omits all the jarJar'd transitive Create-ecosystem deps so we
    // declare them explicitly below. transitive=false matches the official
    // setup at https://wiki.createmod.net/developers/depend-on-create/neoforge-1.21.1
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    // Ponder �?shades net.createmod.catnip.data.Couple, which Create's API
    // surface (RedstoneLinkNetworkHandler.Frequency, getNetworkKey()) references.
    // The standalone Catnip-NeoForge-* artifact has Couple in a different
    // package (net.createmod.catnip.utility) starting in 0.8.x, so we depend on
    // ponder which carries the matching shaded copy.
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    // Registrate �?referenced by some Create classes
    compileOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    // Flywheel API �?for any Create class that exposes Flywheel types
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"

    // ---- CC:Tweaked -------------------------------------------------------
    // CC:T's 1.21.1 build is published as 'forge' and works on NeoForge 1.21.1
    // since NeoForge is API-compatible with Forge at this version.
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-core-api:${cc_tweaked_version}"
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-common-api:${cc_tweaked_version}"
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cc_tweaked_version}"
    // Simulated is jarJar'd inside create-aeronautics-bundled (META-INF/jarjar/).
    // At compile time the outer JAR doesn't expose nested classes, so we need
    // the extracted simulated-neoforge JAR explicitly on the compile classpath.
    compileOnly files("libs/simulated-neoforge-1.21.1-1.3.0.jar")

    // ---- Sable (optional) -------------------------------------------------
    // compileOnly because Sable is an OPTIONAL runtime dep. Our code path that
    // touches Sable types is isolated in SableImpl, which is only class-loaded
    // when ModList reports sable is present at runtime.
    //
    // transitive = false: Sable's POM pulls in sable-companion and veil-neoforge
    // (graphics lib), neither of which we need to compile against �?we only
    // reference dev.ryanhcode.sable.sublevel.SubLevel and Pose3d from the main
    // jar. Skipping transitives avoids hauling in extra maven repos.
    compileOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") {
        transitive = false
    }
    // SubLevelAccess + Pose3d types live in companion; Sable jarJars it at
    // runtime, so we only need this for compileOnly.
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}") {
        transitive = false
    }

    // ---- JEI (optional) ---------------------------------------------------
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // ---- Runtime mods (only present in run tasks, never in the published jar)
    // We use transitive=false to avoid Gradle trying to resolve Create's
    // optional integration deps (FTB Chunks/Teams/Library, JourneyMap, Curios,
    // Architectury, etc.) �?those aren't actually required for Create to load.
    // We explicitly add only what Create's mods.toml hard-requires: flywheel
    // and ponder (registrate is bundled inside Create's jarJar but harmless
    // to declare).
//    localRuntime("com.simibubi.create:create-${minecraft_version}:${create_version}") {
//        transitive = false
//    }
//
//    localRuntime "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
//    localRuntime "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
//    localRuntime "com.tterrag.registrate:Registrate:${registrate_version}"
//
//    localRuntime("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") {
//        transitive = false
//    }
//    // CC:Tweaked full mod jar
//    localRuntime "cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_tweaked_version}"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version          : minecraft_version,
            minecraft_version_range    : minecraft_version_range,
            neo_version                : neo_version,
            neo_version_range          : neo_version_range,
            loader_version_range       : loader_version_range,
            create_version_range       : create_version_range,
            cc_tweaked_version_range   : cc_tweaked_version_range,
            sable_version_range        : sable_version_range,
            mod_id                     : mod_id,
            mod_name                   : mod_name,
            mod_license                : mod_license,
            mod_version                : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
