# NeoForge mod metadata for CCPE — Aircraft Systems
# See: https://docs.neoforged.net/docs/gettingstarted/modfiles

modLoader = "javafml"
loaderVersion = "[1,)"

license = "MIT"

[[mods]]
modId = "ccpe"
version = "1.2.8-1.21.1"
displayName = "CCPE — Aircraft Systems"
authors = "ZombieEggStew"

description = '''
CCPE turns Create: Aeronautics craft into computers you can fly.
- Sensors: static port, pitot tube, INS, flight management computer (FMC/AIC), flight data recorder
- Actuators: servo bearing, aero bearing, electronic transmission, vector thrust nozzle
- Engines: modular engine core with combustion / steam chambers and cooling
- Cockpit: control desk (joystick, throttle, pedal) and modular monitor
- Connectivity: peripheral extender, redstone transceiver, short-range signal linker
Everything is driven from ComputerCraft: Tweaked Lua at the 20 Hz tick.
'''

# =========================================================================
# Dependencies
# =========================================================================
# NeoForge
[[dependencies.ccpe]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

# Create (required — we extend IWrenchable and use Create's Redstone Link API)
[[dependencies.ccpe]]
modId = "create"
type = "required"
versionRange = "[6.0,)"
ordering = "AFTER"
side = "BOTH"

# CC:Tweaked (required — PeripheralCapability)
[[dependencies.ccpe]]
modId = "computercraft"
type = "required"
versionRange = "[1.118,)"
ordering = "AFTER"
side = "BOTH"

# Flywheel (required — visual rendering)
[[dependencies.ccpe]]
modId = "flywheel"
type = "required"
versionRange = "[1.0,)"
ordering = "AFTER"
side = "CLIENT"

# Simulated (required — NavTable caching in PeripheralExtenderBlockEntity)
[[dependencies.ccpe]]
modId = "simulated"
type = "required"
versionRange = "[1.3,)"
ordering = "AFTER"
side = "BOTH"

# Aeronautics (required — propeller bearing thrust/airflow physics config,
# read by the ccpe.sensor_system propeller tool)
[[dependencies.ccpe]]
modId = "aeronautics"
type = "required"
versionRange = "[1.3,)"
ordering = "AFTER"
side = "BOTH"

# Sable (required — physics anti-unload tickets and physics data API)
[[dependencies.ccpe]]
modId = "sable"
type = "required"
versionRange = "[2.0,)"
ordering = "AFTER"
side = "BOTH"

# Sable Companion (required — pulled by Sable)
[[dependencies.ccpe]]
modId = "sablecompanion"
type = "required"
versionRange = "[1.6,)"
ordering = "AFTER"
side = "BOTH"

# JEI (optional — item/recipe viewing compatibility)
[[dependencies.ccpe]]
modId = "jei"
type = "optional"
versionRange = "[19,)"
ordering = "NONE"
side = "BOTH"

# Jade (optional — quick_fill_fuel_vault 内容物 tooltip 显示)
[[dependencies.ccpe]]
modId = "jade"
type = "optional"
versionRange = "[15,)"
ordering = "NONE"
side = "CLIENT"

